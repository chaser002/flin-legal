<!DOCTYPE html>

<head>

<title>Flin Bot - Legal</title>
<style>
:root{--bg:#ffffff;--fg:#1c1e21;--muted:#5b6470;--card:#f4f5f8;--accent:#4752c4;--border:#e1e4ea}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

nav{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 26px}
nav a{padding:6px 12px;border:1px solid var(--border);border-radius:999px;text-decoration:none;background:var(--card)}
.lang{border-top:1px solid var(--border);margin-top:46px;padding-top:6px}
ul{padding-left:22px}
footer{margin-top:50px;font-size:.88rem;color:var(--muted)}
